name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft browser tests (deferred)' || 'e2e' }}
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WAYBOOK_CONTROL_DATABASE_URL: postgresql://waybook:waybook@127.0.0.1:5432/waybook_e2e_control
      WAYBOOK_NORDIC_STUDIO_DATABASE_URL: postgresql://waybook:waybook@127.0.0.1:5432/waybook_e2e_nordic
      WAYBOOK_COPENHAGEN_PHYSIO_DATABASE_URL: postgresql://waybook:waybook@127.0.0.1:5432/waybook_e2e_copenhagen

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Playwright image version
        run: node -e 'if (require("@playwright/test/package.json").version !== "1.59.1") throw new Error("Update the Playwright E2E image to match the installed version")'

      - name: Build packages
        run: npx turbo build

      - name: Configure isolated gift-card signing key
        run: echo "WAYBOOK_GIFT_CARD_CODE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start isolated Waybook databases
        run: |
          docker run -d --name waybook-e2e -e POSTGRES_USER=waybook -e POSTGRES_PASSWORD=waybook -p 5432:5432 postgres:15-alpine
          for i in $(seq 1 30); do
            if docker exec waybook-e2e pg_isready -h 127.0.0.1 -U waybook -q; then break; fi
            sleep 1
          done
          docker exec waybook-e2e pg_isready -h 127.0.0.1 -U waybook -q
          for name in control nordic copenhagen; do docker exec waybook-e2e createdb -U waybook "waybook_e2e_$name"; done
          npm run waybook:db:migrate
          npm run waybook:db:seed
          node --import tsx scripts/seed-waybook-e2e.mts
          node --import tsx scripts/verify-waybook-transaction-conflicts.mts

      - name: Run Waybook E2E tests
        run: |
          docker run --rm --network host --ipc=host \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/apps/demo" \
            -e CI -e WAYBOOK_CONTROL_DATABASE_URL -e WAYBOOK_NORDIC_STUDIO_DATABASE_URL \
            -e WAYBOOK_COPENHAGEN_PHYSIO_DATABASE_URL -e WAYBOOK_GIFT_CARD_CODE_SECRET \
            mcr.microsoft.com/playwright:v1.59.1-noble npm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/demo/playwright-report/
          retention-days: 14
