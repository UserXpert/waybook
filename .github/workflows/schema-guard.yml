name: Schema history guard

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migration-history:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test schema guard
        run: node --test scripts/check-migration-immutability.test.mjs
      - name: Protect applied migration files
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-migration-immutability.mjs "$BASE_REF"
