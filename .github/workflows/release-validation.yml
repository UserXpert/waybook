name: Release branch validation

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact collected release commit to validate
        required: true
        type: string
      base_sha:
        description: Exact main baseline for migration-history validation
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate release inputs
    runs-on: ubuntu-slim
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_sha }}
          path: .trusted-release-validation
          persist-credentials: false
      - name: Fetch and prove the immutable release baseline
        run: |
          test "$GITHUB_SHA" = "$BASE_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git -C .trusted-release-validation rev-parse HEAD)" = "$BASE_SHA"
          node .trusted-release-validation/scripts/validate-release-inputs.mjs

  package-checks:
    name: Build, typecheck, test, lint (published packages)
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Verify the trusted dispatch and requested release commit
        run: |
          test "$GITHUB_SHA" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run waybook:build
      - run: npm test --workspace=@waybook/app
      - run: node --import tsx --test scripts/waybook-migration-targets.test.ts

  schema-history:
    name: migration-history
    needs: validate-inputs
    runs-on: ubuntu-slim
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Verify the trusted dispatch and requested release commit
        run: |
          test "$GITHUB_SHA" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: node --test scripts/check-migration-immutability.test.mjs
      - run: node scripts/check-migration-immutability.mjs "$BASE_SHA"

  integration:
    name: DB Integration Tests (Postgres 15)
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WAYBOOK_MIGRATION_TEST_DATABASE_URL: postgresql://waybook:waybook@127.0.0.1:5432/postgres
      RELEASE_SHA: ${{ inputs.release_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Verify the trusted dispatch and requested release commit
        run: |
          test "$GITHUB_SHA" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - name: Start and wait for the disposable PostgreSQL container
        run: |
          docker run -d --name release-validation-db -e POSTGRES_DB=postgres -e POSTGRES_USER=waybook -e POSTGRES_PASSWORD=waybook -p 5432:5432 postgres:15-alpine
          for i in $(seq 1 30); do
            if docker exec release-validation-db pg_isready -h 127.0.0.1 -U waybook -d postgres -q; then break; fi
            sleep 1
          done
          docker exec release-validation-db pg_isready -h 127.0.0.1 -U waybook -d postgres -q
      - run: npm ci
      - name: Verify fresh, upgraded, and concurrent Waybook migration histories
        run: node --import tsx scripts/verify-waybook-migrations.mts
      - if: always()
        run: docker rm -f release-validation-db || true

  e2e:
    name: e2e
    needs: validate-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WAYBOOK_CONTROL_DATABASE_URL: postgresql://waybook:waybook@127.0.0.1:5432/waybook_e2e_control
      WAYBOOK_NORDIC_STUDIO_DATABASE_URL: postgresql://waybook:waybook@127.0.0.1:5432/waybook_e2e_nordic
      WAYBOOK_COPENHAGEN_PHYSIO_DATABASE_URL: postgresql://waybook:waybook@127.0.0.1:5432/waybook_e2e_copenhagen
      RELEASE_SHA: ${{ inputs.release_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Verify the trusted dispatch and requested release commit
        run: |
          test "$GITHUB_SHA" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci && npx turbo build
      - name: Check Playwright image version
        run: node -e 'if (require("@playwright/test/package.json").version !== "1.59.1") throw new Error("Update the Playwright E2E image to match the installed version")'
      - run: echo "WAYBOOK_GIFT_CARD_CODE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: |
          docker run -d --name release-validation-e2e -e POSTGRES_USER=waybook -e POSTGRES_PASSWORD=waybook -p 5432:5432 postgres:15-alpine
          for i in $(seq 1 30); do docker exec release-validation-e2e pg_isready -h 127.0.0.1 -U waybook -q && break; sleep 1; done
          for name in control nordic copenhagen; do docker exec release-validation-e2e createdb -U waybook "waybook_e2e_$name"; done
          npm run waybook:db:migrate && npm run waybook:db:seed
          node --import tsx scripts/seed-waybook-e2e.mts
          node --import tsx scripts/verify-waybook-transaction-conflicts.mts
      - run: docker run --rm --network host --ipc=host -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/apps/demo" -e CI -e WAYBOOK_CONTROL_DATABASE_URL -e WAYBOOK_NORDIC_STUDIO_DATABASE_URL -e WAYBOOK_COPENHAGEN_PHYSIO_DATABASE_URL -e WAYBOOK_GIFT_CARD_CODE_SECRET mcr.microsoft.com/playwright:v1.59.1-noble npm run e2e
      - if: always()
        run: docker rm -f release-validation-e2e || true
