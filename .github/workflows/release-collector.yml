name: Collect release-ready PRs

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  checks: read
  actions: write

concurrency:
  group: release-branch-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Collect explicitly release-ready same-repository PRs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: release/ready
        run: node scripts/collect-release-branch.mjs
