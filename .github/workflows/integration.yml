name: Integration Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

env:
  WAYBOOK_MIGRATION_TEST_DATABASE_URL: postgresql://waybook:waybook@127.0.0.1:5432/postgres

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft database integration (deferred)' || 'DB Integration Tests (Postgres 15)' }}
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start PostgreSQL container
        run: |
          docker run -d \
            --name waybook-migration-test-db \
            -e POSTGRES_DB=postgres \
            -e POSTGRES_USER=waybook \
            -e POSTGRES_PASSWORD=waybook \
            -p 127.0.0.1:5432:5432 \
            postgres:15-alpine

          # Wait until Postgres is ready (up to 30s)
          ready=0
          for i in $(seq 1 30); do
            if docker exec waybook-migration-test-db pg_isready -h 127.0.0.1 -U waybook -d postgres -q 2>/dev/null; then
              ready=1
              break
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 1
          done
          if [ "$ready" -eq 0 ]; then
            echo "Postgres did not become ready within 30s"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify fresh, upgraded, and concurrent Waybook migration histories
        run: node --import tsx scripts/verify-waybook-migrations.mts

      - name: Remove PostgreSQL container and volume
        if: always()
        run: |
          docker stop waybook-migration-test-db || true
          docker rm -v waybook-migration-test-db || true
