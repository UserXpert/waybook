name: Package Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft package checks (deferred)' || 'Build, typecheck, test, lint (published packages)' }}
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Waybook
        run: npm run waybook:build

      - name: Waybook app and tooling unit tests
        run: |
          npm test --workspace=@waybook/app
          node --import tsx --test scripts/waybook-migration-targets.test.ts
